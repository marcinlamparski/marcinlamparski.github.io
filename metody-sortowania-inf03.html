<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metody sortowania — INF.03</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito Sans', 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(180deg, #F0F4FF 0%, #FAFBFF 40%, #fff 100%); min-height: 100vh; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SORTS = [
      {
        id: "bubble", name: "Sortowanie bąbelkowe", nameEn: "Bubble Sort", icon: "🫧",
        color: "#E8443A", colorLight: "#FEE8E7",
        idea: "Porównujemy sąsiednie elementy i zamieniamy je, jeśli są w złej kolejności. Powtarzamy przejścia aż do posortowania.",
        steps: [
          "Przejdź przez tablicę od lewej do prawej",
          "Porównaj element [i] z [i+1] — zamień jeśli [i] > [i+1]",
          "Po jednym przejściu największy element „wypływa" na koniec",
          "Powtarzaj, aż nie zajdzie żadna zamiana",
        ],
        bestCase: "O(n)", avgCase: "O(n²)", worstCase: "O(n²)", memory: "O(1)",
        stable: true, inPlace: true,
        examTip: "Najczęściej pytany na egzaminie! Pamiętaj — po k przejściach, k ostatnich elementów jest na swoim miejscu.",
        example: {
          before: [5, 3, 8, 1, 2],
          passes: [
            { arr: [3, 5, 1, 2, 8], note: "8 wypłynęło na koniec" },
            { arr: [3, 1, 2, 5, 8], note: "5 na swoim miejscu" },
            { arr: [1, 2, 3, 5, 8], note: "Posortowane!" },
          ],
        },
      },
      {
        id: "selection", name: "Sortowanie przez wybieranie", nameEn: "Selection Sort", icon: "🎯",
        color: "#2563EB", colorLight: "#DBEAFE",
        idea: "Znajdź najmniejszy element w nieposortowanej części i zamień go z pierwszym nieposortowanym.",
        steps: [
          "Znajdź minimum w nieposortowanej części tablicy",
          "Zamień je z pierwszym elementem nieposortowanej części",
          "Przesuń granicę posortowanej części o 1 w prawo",
          "Powtarzaj aż cała tablica będzie posortowana",
        ],
        bestCase: "O(n²)", avgCase: "O(n²)", worstCase: "O(n²)", memory: "O(1)",
        stable: false, inPlace: true,
        examTip: "Zawsze wykonuje dokładnie n(n-1)/2 porównań, niezależnie od danych wejściowych. Złożoność zawsze O(n²).",
        example: {
          before: [5, 3, 8, 1, 2],
          passes: [
            { arr: [1, 3, 8, 5, 2], note: "Min=1, zamiana z 5" },
            { arr: [1, 2, 8, 5, 3], note: "Min=2, zamiana z 3" },
            { arr: [1, 2, 3, 5, 8], note: "Min=3, zamiana z 8" },
          ],
        },
      },
      {
        id: "insertion", name: "Sortowanie przez wstawianie", nameEn: "Insertion Sort", icon: "🃏",
        color: "#16A34A", colorLight: "#DCFCE7",
        idea: "Bierzemy kolejny element i wstawiamy go we właściwe miejsce w już posortowanej części — jak układanie kart w ręce.",
        steps: [
          "Weź kolejny element z nieposortowanej części",
          "Porównuj go z elementami posortowanej części (od prawej)",
          "Przesuwaj większe elementy w prawo",
          "Wstaw element na znalezione miejsce",
        ],
        bestCase: "O(n)", avgCase: "O(n²)", worstCase: "O(n²)", memory: "O(1)",
        stable: true, inPlace: true,
        examTip: "Najlepszy dla prawie posortowanych danych! O(n) w najlepszym przypadku. Analogia z kartami w ręce pojawia się na egzaminie.",
        example: {
          before: [5, 3, 8, 1, 2],
          passes: [
            { arr: [3, 5, 8, 1, 2], note: "3 wstawione przed 5" },
            { arr: [3, 5, 8, 1, 2], note: "8 zostaje na miejscu" },
            { arr: [1, 3, 5, 8, 2], note: "1 wstawione na początek" },
            { arr: [1, 2, 3, 5, 8], note: "2 wstawione za 1" },
          ],
        },
      },
      {
        id: "quick", name: "Sortowanie szybkie", nameEn: "Quick Sort", icon: "⚡",
        color: "#D97706", colorLight: "#FEF3C7",
        idea: "Wybierz element zwany pivotem. Podziel tablicę na elementy mniejsze i większe od pivota. Rekurencyjnie posortuj obie części.",
        steps: [
          "Wybierz pivot (np. ostatni element)",
          "Podziel: mniejsze od pivota → lewa, większe → prawa",
          "Pivot trafia na swoje ostateczne miejsce",
          "Rekurencyjnie sortuj lewą i prawą podtablicę",
        ],
        bestCase: "O(n log n)", avgCase: "O(n log n)", worstCase: "O(n²)", memory: "O(log n)",
        stable: false, inPlace: true,
        examTip: "Najszybszy w praktyce! Działa na zasadzie „dziel i zwyciężaj". Najgorszy przypadek (O(n²)) — gdy pivot to zawsze min/max.",
        example: {
          before: [5, 3, 8, 1, 2],
          passes: [
            { arr: [1, 2, 3, 8, 5], note: "Pivot=2 → [1] [2] [5,3,8]" },
            { arr: [1, 2, 3, 5, 8], note: "Pivot=5 → [3] [5] [8]" },
          ],
        },
      },
      {
        id: "merge", name: "Sortowanie przez scalanie", nameEn: "Merge Sort", icon: "🔀",
        color: "#9333EA", colorLight: "#F3E8FF",
        idea: "Dziel tablicę na pół aż do elementów pojedynczych, potem scalaj posortowane części w jedną posortowaną całość.",
        steps: [
          "Podziel tablicę na dwie równe połowy",
          "Rekurencyjnie posortuj każdą połowę",
          "Scal (merge) dwie posortowane połowy w jedną",
          "Scalanie: porównuj pierwsze elementy obu połówek",
        ],
        bestCase: "O(n log n)", avgCase: "O(n log n)", worstCase: "O(n log n)", memory: "O(n)",
        stable: true, inPlace: false,
        examTip: "Gwarantowane O(n log n) w każdym przypadku! Wymaga dodatkowej pamięci O(n). Stabilne sortowanie — zachowuje kolejność równych elementów.",
        example: {
          before: [5, 3, 8, 1, 2],
          passes: [
            { arr: [5, 3, 8, 1, 2], note: "Dziel: [5,3] [8] [1,2]" },
            { arr: [3, 5, 1, 2, 8], note: "Sortuj podtablice" },
            { arr: [1, 2, 3, 5, 8], note: "Scal wszystko" },
          ],
        },
      },
    ];

    function Badge({ children, color, bg }) {
      return (
        <span style={{
          display: "inline-block", padding: "2px 10px", borderRadius: "999px",
          fontSize: "12px", fontWeight: 700, letterSpacing: "0.03em",
          color: color, background: bg, border: `1.5px solid ${color}22`,
        }}>
          {children}
        </span>
      );
    }

    function ArrayVis({ arr, highlight, color }) {
      return (
        <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
          {arr.map((v, i) => (
            <div key={i} style={{
              width: "36px", height: "36px", display: "flex", alignItems: "center", justifyContent: "center",
              borderRadius: "8px", fontWeight: 800, fontSize: "15px",
              fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
              background: highlight?.includes(i) ? color : "#F1F5F9",
              color: highlight?.includes(i) ? "#fff" : "#334155",
              transition: "all 0.3s ease",
              border: `1.5px solid ${highlight?.includes(i) ? color : "#E2E8F0"}`,
            }}>
              {v}
            </div>
          ))}
        </div>
      );
    }

    function SortCard({ sort, isOpen, onToggle }) {
      const [step, setStep] = useState(0);

      return (
        <div style={{
          background: "#fff", borderRadius: "16px",
          border: `2px solid ${isOpen ? sort.color + "44" : "#E2E8F0"}`,
          overflow: "hidden", transition: "all 0.3s ease",
          boxShadow: isOpen ? `0 8px 32px ${sort.color}15` : "0 1px 3px rgba(0,0,0,0.04)",
        }}>
          <button onClick={onToggle} style={{
            width: "100%", padding: "18px 22px", display: "flex", alignItems: "center", gap: "14px",
            background: isOpen ? sort.colorLight : "transparent",
            border: "none", cursor: "pointer", textAlign: "left", transition: "background 0.3s ease",
          }}>
            <span style={{ fontSize: "28px", lineHeight: 1 }}>{sort.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: "17px", color: "#0F172A" }}>
                {sort.name}
              </div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "12px", color: "#94A3B8", marginTop: "2px" }}>
                {sort.nameEn}
              </div>
            </div>
            <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", justifyContent: "flex-end" }}>
              <Badge color={sort.color} bg={sort.colorLight}>avg {sort.avgCase}</Badge>
              {sort.stable && <Badge color="#16A34A" bg="#DCFCE7">stabilne</Badge>}
            </div>
            <span style={{
              fontSize: "20px", color: "#94A3B8",
              transform: isOpen ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.3s ease",
            }}>▾</span>
          </button>

          {isOpen && (
            <div style={{ padding: "0 22px 22px" }}>
              <p style={{
                margin: "0 0 16px", fontSize: "14.5px", lineHeight: 1.65, color: "#334155",
                fontStyle: "italic", borderLeft: `3px solid ${sort.color}`, paddingLeft: "14px",
              }}>
                {sort.idea}
              </p>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px", marginBottom: "16px" }}>
                <div>
                  <div style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "#94A3B8", marginBottom: "8px" }}>
                    Kroki algorytmu
                  </div>
                  <ol style={{ margin: 0, paddingLeft: "18px", fontSize: "13.5px", lineHeight: 1.7, color: "#475569" }}>
                    {sort.steps.map((s, i) => <li key={i} style={{ marginBottom: "3px" }}>{s}</li>)}
                  </ol>
                </div>

                <div>
                  <div style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "#94A3B8", marginBottom: "8px" }}>
                    Złożoność
                  </div>
                  <table style={{ width: "100%", fontSize: "13px", borderCollapse: "collapse" }}>
                    <tbody>
                      {[["Najlepszy", sort.bestCase], ["Średni", sort.avgCase], ["Najgorszy", sort.worstCase], ["Pamięć", sort.memory]].map(([label, val]) => (
                        <tr key={label}>
                          <td style={{ padding: "4px 8px 4px 0", color: "#64748B", fontWeight: 500 }}>{label}</td>
                          <td style={{ padding: "4px 0", fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "#0F172A" }}>{val}</td>
                        </tr>
                      ))}
                      <tr>
                        <td style={{ padding: "4px 8px 4px 0", color: "#64748B", fontWeight: 500 }}>Stabilne</td>
                        <td style={{ padding: "4px 0", fontWeight: 700 }}>{sort.stable ? "✅ Tak" : "❌ Nie"}</td>
                      </tr>
                      <tr>
                        <td style={{ padding: "4px 8px 4px 0", color: "#64748B", fontWeight: 500 }}>In-place</td>
                        <td style={{ padding: "4px 0", fontWeight: 700 }}>{sort.inPlace ? "✅ Tak" : "❌ Nie"}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Interactive example */}
              <div style={{ background: "#F8FAFC", borderRadius: "12px", padding: "14px 16px", marginBottom: "14px", border: "1px solid #E2E8F0" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
                  <div style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "#94A3B8" }}>
                    Przykład krok po kroku
                  </div>
                  <div style={{ display: "flex", gap: "6px" }}>
                    <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0}
                      style={{ width: "28px", height: "28px", borderRadius: "8px", border: "1.5px solid #E2E8F0",
                        background: step === 0 ? "#F1F5F9" : "#fff", cursor: step === 0 ? "default" : "pointer",
                        fontSize: "14px", color: step === 0 ? "#CBD5E1" : "#475569",
                        display: "flex", alignItems: "center", justifyContent: "center" }}>◀</button>
                    <button onClick={() => setStep(Math.min(sort.example.passes.length, step + 1))}
                      disabled={step === sort.example.passes.length}
                      style={{ width: "28px", height: "28px", borderRadius: "8px", border: "1.5px solid #E2E8F0",
                        background: step === sort.example.passes.length ? "#F1F5F9" : "#fff",
                        cursor: step === sort.example.passes.length ? "default" : "pointer",
                        fontSize: "14px", color: step === sort.example.passes.length ? "#CBD5E1" : "#475569",
                        display: "flex", alignItems: "center", justifyContent: "center" }}>▶</button>
                  </div>
                </div>
                <ArrayVis
                  arr={step === 0 ? sort.example.before : sort.example.passes[step - 1].arr}
                  color={sort.color}
                  highlight={step === 0 ? [] : step === sort.example.passes.length ? sort.example.passes[step - 1].arr.map((_, i) => i) : []}
                />
                <div style={{ marginTop: "8px", fontSize: "13px", color: "#64748B", fontStyle: "italic" }}>
                  {step === 0 ? "Tablica wejściowa — kliknij ▶" : sort.example.passes[step - 1].note}
                </div>
              </div>

              {/* Exam tip */}
              <div style={{
                background: `linear-gradient(135deg, ${sort.color}08, ${sort.color}12)`,
                borderRadius: "10px", padding: "12px 14px", display: "flex", gap: "10px",
                alignItems: "flex-start", border: `1.5px solid ${sort.color}22`,
              }}>
                <span style={{ fontSize: "18px" }}>📝</span>
                <div>
                  <div style={{ fontSize: "11px", fontWeight: 800, textTransform: "uppercase", letterSpacing: "0.08em", color: sort.color, marginBottom: "3px" }}>
                    Wskazówka egzaminacyjna
                  </div>
                  <div style={{ fontSize: "13px", lineHeight: 1.6, color: "#334155" }}>{sort.examTip}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SortingMethods() {
      const [openId, setOpenId] = useState("bubble");
      const [showComparison, setShowComparison] = useState(false);

      return (
        <div>
          {/* Header */}
          <div style={{
            background: "linear-gradient(135deg, #0F172A 0%, #1E293B 100%)",
            padding: "32px 24px 28px", textAlign: "center", position: "relative", overflow: "hidden",
          }}>
            <div style={{
              position: "absolute", inset: 0,
              background: "radial-gradient(circle at 20% 50%, #3B82F620, transparent 50%), radial-gradient(circle at 80% 50%, #9333EA18, transparent 50%)",
            }} />
            <div style={{ position: "relative" }}>
              <div style={{
                display: "inline-block", padding: "4px 14px", borderRadius: "999px",
                background: "#3B82F620", border: "1px solid #3B82F640",
                fontSize: "12px", fontWeight: 700, letterSpacing: "0.08em", color: "#93C5FD", marginBottom: "12px",
              }}>
                INF.03 — EGZAMIN ZAWODOWY
              </div>
              <h1 style={{
                margin: "0 0 6px", fontFamily: "'Syne', sans-serif", fontWeight: 800,
                fontSize: "clamp(24px, 5vw, 34px)", color: "#F8FAFC", letterSpacing: "-0.02em", lineHeight: 1.15,
              }}>
                Metody sortowania
              </h1>
              <p style={{
                margin: 0, fontSize: "14.5px", color: "#94A3B8", maxWidth: "520px",
                marginLeft: "auto", marginRight: "auto", lineHeight: 1.5,
              }}>
                Kompletne kompendium algorytmów sortowania — definicje, złożoności, przykłady i wskazówki egzaminacyjne
              </p>
            </div>
          </div>

          {/* Key concepts */}
          <div style={{ maxWidth: "720px", margin: "-16px auto 0", padding: "0 16px", position: "relative", zIndex: 2 }}>
            <div style={{
              background: "#fff", borderRadius: "14px", padding: "16px 20px",
              display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "12px",
              boxShadow: "0 4px 24px rgba(0,0,0,0.06)", border: "1px solid #E2E8F0",
            }}>
              {[
                { label: "Stabilność", desc: "Czy elementy o równych kluczach zachowują kolejność", emoji: "⚖️" },
                { label: "In-place", desc: "Czy sortuje bez dodatkowej tablicy (pamięć O(1))", emoji: "📦" },
                { label: "Złożoność", desc: "Ile operacji potrzeba — O(n), O(n²), O(n log n)", emoji: "⏱️" },
              ].map((c) => (
                <div key={c.label} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: "22px", marginBottom: "4px" }}>{c.emoji}</div>
                  <div style={{ fontWeight: 800, fontSize: "13px", color: "#0F172A" }}>{c.label}</div>
                  <div style={{ fontSize: "11.5px", color: "#64748B", lineHeight: 1.4, marginTop: "2px" }}>{c.desc}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Sort cards */}
          <div style={{ maxWidth: "720px", margin: "24px auto 0", padding: "0 16px", display: "flex", flexDirection: "column", gap: "10px" }}>
            {SORTS.map((sort) => (
              <SortCard key={sort.id} sort={sort} isOpen={openId === sort.id}
                onToggle={() => setOpenId(openId === sort.id ? null : sort.id)} />
            ))}
          </div>

          {/* Comparison table */}
          <div style={{ maxWidth: "720px", margin: "24px auto", padding: "0 16px" }}>
            <button onClick={() => setShowComparison(!showComparison)} style={{
              width: "100%", padding: "14px", borderRadius: "14px", border: "2px solid #E2E8F0",
              background: showComparison ? "#0F172A" : "#fff",
              color: showComparison ? "#F8FAFC" : "#0F172A",
              fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: "15px",
              cursor: "pointer", transition: "all 0.3s ease", letterSpacing: "0.02em",
            }}>
              {showComparison ? "▾ Ukryj" : "▸ Pokaż"} tabelę porównawczą
            </button>

            {showComparison && (
              <div style={{
                marginTop: "12px", background: "#fff", borderRadius: "14px", overflow: "hidden",
                border: "1.5px solid #E2E8F0", boxShadow: "0 4px 24px rgba(0,0,0,0.05)",
              }}>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "13px", whiteSpace: "nowrap" }}>
                    <thead>
                      <tr style={{ background: "#F8FAFC", borderBottom: "2px solid #E2E8F0" }}>
                        {["Algorytm", "Best", "Avg", "Worst", "Pamięć", "Stab."].map((h) => (
                          <th key={h} style={{
                            padding: "10px 12px", textAlign: "left", fontSize: "11px", fontWeight: 800,
                            textTransform: "uppercase", letterSpacing: "0.08em", color: "#64748B",
                          }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {SORTS.map((s, i) => (
                        <tr key={s.id} style={{ borderBottom: i < SORTS.length - 1 ? "1px solid #F1F5F9" : "none" }}>
                          <td style={{ padding: "10px 12px", fontWeight: 700, color: s.color }}>{s.icon} {s.name}</td>
                          {[s.bestCase, s.avgCase, s.worstCase, s.memory].map((v, j) => (
                            <td key={j} style={{ padding: "10px 12px", fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, color: "#334155" }}>{v}</td>
                          ))}
                          <td style={{ padding: "10px 12px" }}>{s.stable ? "✅" : "❌"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>

          {/* Quick cheat sheet */}
          <div style={{ maxWidth: "720px", margin: "0 auto 32px", padding: "0 16px" }}>
            <div style={{
              background: "linear-gradient(135deg, #FEF9C3, #FEF3C7)",
              borderRadius: "14px", padding: "18px 20px", border: "1.5px solid #F59E0B33",
            }}>
              <div style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: "15px", color: "#92400E", marginBottom: "10px" }}>
                💡 Szybka ściąga do zapamiętania
              </div>
              <div style={{ fontSize: "13.5px", lineHeight: 1.75, color: "#78350F" }}>
                <strong>Proste (O(n²)):</strong> bąbelkowe, przez wybieranie, przez wstawianie — dobre dla małych zbiorów.<br />
                <strong>Szybkie (O(n log n)):</strong> Quick Sort (najszybszy w praktyce), Merge Sort (gwarancja O(n log n)).<br />
                <strong>Stabilne:</strong> bąbelkowe, przez wstawianie, przez scalanie — pamiętaj, Quick Sort i Selection Sort NIE SĄ stabilne!<br />
                <strong>Pamięć:</strong> Merge Sort jako jedyny wymaga O(n) dodatkowej pamięci — reszta jest in-place.
              </div>
            </div>
          </div>

          {/* Footer */}
          <div style={{ textAlign: "center", padding: "16px", fontSize: "12px", color: "#94A3B8" }}>
            Materiał dydaktyczny • Technikum informatyczne • Kwalifikacja INF.03
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SortingMethods />);
  </script>
</body>
